<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        content="Get in touch with Jonna Mae Largo for Virtual Assistant, Social Media Management, and Administrative support inquiries.">
    <meta name="keywords"
        content="Contact Jonna Mae Largo, Hire a Virtual Assistant, VA Services, Business Support, Jonna Largo Email.">
    <meta name="author" content="Jonna Mae Largo">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jonnalargo.github.io/contact.html">
    <meta property="og:title" content="Contact | Jonna Mae Largo - Virtual Assistant">

    <meta property="og:image" content="https://jonnalargo.github.io/assets/img/banner/Banner Image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://jonnalargo.github.io/contact.html">
    <meta property="twitter:title" content="Contact | Jonna Mae Largo - Virtual Assistant">
    <meta property="twitter:description" content="Have a project in mind? Let's connect. I'd love to hear from you.">
    <meta property="twitter:image" content="https://jonnalargo.github.io/assets/img/banner/Banner Image.jpg">

    <title>Contact Me | Jonna Mae Largo</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <header id="site-header"></header>

    <main>
        <section class="contact-section">
            <div class="contact-container">
                <h1 class="section-title">Get in Touch</h1>
                <p class="section-subtitle">Have a project in mind? I'd love to hear from you.</p>

                <div class="contact-card">
                    <form id="contactForm" class="contact-form">
                        <div class="form-group">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="Your Name"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" id="subject" name="subject" class="form-input"
                                placeholder="How can I help?" required>
                        </div>
                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" name="message" class="form-textarea"
                                placeholder="Your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary form-submit" id="submitBtn">
                            Send Message <span>↗</span>
                        </button>
                    </form>
                    <div id="formStatus" class="form-status"></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/contact.js"></script>
</body>

</html>
